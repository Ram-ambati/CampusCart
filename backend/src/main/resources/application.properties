# ===============================
spring.config.import=optional:file:.env[.properties]
# SERVER CONFIGURATION
# ===============================
server.port=${PORT:8080}
spring.application.name=campuscart
server.forward-headers-strategy=framework

# ===============================
# SUPABASE POSTGRESQL CONFIGURATION
# ===============================
# Replace the URL, username, and password with your Supabase credentials.
# You can find these in your Supabase Dashboard -> Project Settings -> Database.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# FLYWAY MIGRATION CONFIGURATION
# ===============================
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ===============================
# JWT & SECURITY CONFIGURATION
# ===============================
app.jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-jwt-generation-which-must-be-at-least-256-bits-for-hs256}
app.jwt.expiration-ms=86400000
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# GOOGLE OAUTH2 CONFIGURATION
# ===============================
# Replace these with your actual Google Cloud Console credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# ===============================
# TEMPORARY EXCLUSIONS (Remove later)
# ===============================
# We are temporarily disabling Redis, RabbitMQ, and Security until we configure them in later phases.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# ===============================
# CLOUDINARY CONFIGURATION
# ===============================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}