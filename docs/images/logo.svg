<svg width="600" height="120" viewBox="0 0 600 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: -1.5px;
      }
      
      /* Colors that work on both light and dark backgrounds */
      .text-campus { fill: #6366f1; } /* Vibrant Indigo */
      .text-cart { fill: #06b6d4; font-weight: 700; } /* Neon Cyan */

      /* Letter animation */
      @keyframes pop-in {
        0% { opacity: 0; }
        100% { opacity: 1; }
      }
      
      .letter {
        opacity: 0;
        animation: pop-in 0.3s forwards cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      .l1 { animation-delay: 0.2s; }
      .l2 { animation-delay: 0.3s; }
      .l3 { animation-delay: 0.4s; }
      .l4 { animation-delay: 0.5s; }
      .l5 { animation-delay: 0.6s; }
      .l6 { animation-delay: 0.7s; }
      
      .l7 { animation-delay: 0.8s; }
      .l8 { animation-delay: 0.9s; }
      .l9 { animation-delay: 1.0s; }
      .l10 { animation-delay: 1.1s; }
    </style>
  </defs>

  <!-- Animated C Icon -->
  <g transform="translate(10, 20)">
    <rect width="80" height="80" rx="18" fill="#6366f1">
      <animate attributeName="rx" values="18; 30; 18" dur="4s" repeatCount="indefinite" />
      <animate attributeName="fill" values="#6366f1; #4f46e5; #6366f1" dur="4s" repeatCount="indefinite" />
    </rect>
    <path d="M52 29C49.5 27 46 26 41 26C32 26 26 32 26 40C26 48 32 54 41 54C46 54 49.5 53 52 51" 
          stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" 
          stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100; 0" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.4 0 0.2 1" />
    </path>
  </g>

  <!-- Animated Text -->
  <text x="110" y="80" class="logo-text">
    <tspan class="text-campus letter l1">C</tspan>
    <tspan class="text-campus letter l2">a</tspan>
    <tspan class="text-campus letter l3">m</tspan>
    <tspan class="text-campus letter l4">p</tspan>
    <tspan class="text-campus letter l5">u</tspan>
    <tspan class="text-campus letter l6">s</tspan>
    <tspan class="text-cart letter l7">C</tspan>
    <tspan class="text-cart letter l8">a</tspan>
    <tspan class="text-cart letter l9">r</tspan>
    <tspan class="text-cart letter l10">t</tspan>
  </text>
</svg>
