<svg width="500" height="120" viewBox="0 0 500 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        font-size: 56px;
        letter-spacing: -1.5px;
        fill: #0f172a;
      }
      .logo-text-cart {
        fill: #475569;
        font-weight: 700;
      }
    </style>
  </defs>

  <!-- Animated C Icon -->
  <g transform="translate(10, 20)">
    <rect width="80" height="80" rx="18" fill="#0f172a">
      <animate attributeName="rx" values="18; 30; 18" dur="4s" repeatCount="indefinite" />
    </rect>
    <path d="M52 29C49.5 27 46 26 41 26C32 26 26 32 26 40C26 48 32 54 41 54C46 54 49.5 53 52 51" 
          stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" 
          stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" values="100; 0" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.4 0 0.2 1" />
    </path>
  </g>

  <!-- Text -->
  <g opacity="0">
    <text x="110" y="80" class="logo-text">
      Campus<tspan class="logo-text-cart">Cart</tspan>
    </text>
    <animate attributeName="opacity" values="0; 1" dur="1.2s" fill="freeze" calcMode="spline" keyTimes="0; 1" keySplines="0.4 0 0.2 1" />
  </g>
</svg>
